name: Validate HCS site
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and workflow tests
        run: npm run check && npm test

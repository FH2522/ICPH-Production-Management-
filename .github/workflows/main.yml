name: ICPH HCS - Test and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: icph-hcs-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize files and test HCS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/src _check/src _check/tests
          cp index.html config.js _site/

          # Support either a src/ folder or your current flat repository layout.
          if [[ -f src/main.mjs && -f src/domain.mjs && -f src/repository.mjs && -f src/styles.css ]]; then
            echo 'Found structured source files under src/'
            cp src/*.mjs src/styles.css _site/src/
          else
            echo 'Found flattened source files in repository root.'
            cp ./*.mjs styles.css _site/src/
          fi

          # Header images are published beside styles.css in _site/src/.
          # The source repository currently keeps these image files at its root.
          for asset in pcpl-logo.webp hcs-header.webp; do
            if [[ -f "$asset" ]]; then
              cp "$asset" _site/src/
            elif [[ -f "src/$asset" ]]; then
              cp "src/$asset" _site/src/
            else
              echo "ERROR: missing header image $asset" >&2
              exit 1
            fi
          done

          if compgen -G 'tests/*.test.mjs' >/dev/null; then
            cp tests/*.test.mjs _check/tests/
          else
            cp ./*.test.mjs _check/tests/
          fi
          cp _site/src/domain.mjs _check/src/

          # Verify that every local JS module imported by the deployed app exists.
          node --check _site/src/main.mjs
          node --check _site/src/domain.mjs
          node --check _site/src/repository.mjs
          if [[ -f _site/src/attachments.mjs ]]; then node --check _site/src/attachments.mjs; fi
          node --input-type=module -e "import('./_site/src/repository.mjs').then(() => console.log('All repository module imports resolved'))"
          node --test _check/tests/*.test.mjs
          touch _site/.nojekyll
          echo 'Deployment files:'
          ls -la _site/src/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
